name: Banking deploy dev

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: GAR image tag (e.g. develop-latest or git SHA)
        required: true
        default: develop-latest
      use_connect_gateway:
        description: Use GKE Connect Gateway (required for private endpoint from GitHub-hosted runners)
        type: boolean
        default: false

concurrency:
  group: banking-deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: ai-rag-agent-project
  REGION: asia-south1
  CLUSTER: banking-dev
  NAMESPACE: banking-dev

jobs:
  # Private GKE (172.16.x) is not reachable from GitHub-hosted runners unless Connect
  # Gateway or a VPC runner is configured. Avoid a red develop pipeline on every merge.
  deploy:
    name: Helm upgrade (GKE dev)
    if: github.event_name == 'workflow_dispatch' || vars.GKE_CI_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || 'develop-latest' }}
      USE_CONNECT_GATEWAY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_connect_gateway || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          use_connect_gateway: ${{ env.USE_CONNECT_GATEWAY == 'true' }}

      - name: Verify Kubernetes API reachability
        run: |
          if ! kubectl get ns --request-timeout=20s >/dev/null 2>&1; then
            echo "::error::Cannot reach the GKE API from this runner (private control plane)."
            echo "Use workflow_dispatch with use_connect_gateway=true after Connect Gateway is enabled,"
            echo "deploy from a laptop (docs/DEPLOY.md), or use a self-hosted runner in the VPC."
            exit 1
          fi

      - name: Sync DB secret from Secret Manager
        run: |
          chmod +x scripts/sync-db-secret.sh
          ./scripts/sync-db-secret.sh dev

      - name: helm upgrade
        run: |
          helm lint helm/banking-platform
          helm upgrade --install banking-platform helm/banking-platform \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set global.imageTag="${IMAGE_TAG}" \
            --wait --timeout 15m

      - name: rollout status
        run: kubectl get deploy,svc -n "${NAMESPACE}"

  develop-push-note:
    name: Skip auto-deploy (private cluster)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Develop merge recorded. Auto-deploy from GitHub-hosted runners is disabled for private GKE."
          echo "Deploy manually: Actions → Banking deploy dev → Run workflow (Connect Gateway),"
          echo "or locally: ./scripts/deploy-dev.sh dev develop-latest (see docs/DEPLOY.md)."
          echo "To re-enable CI deploy after VPC runner or Connect Gateway: set repo variable GKE_CI_DEPLOY=true."
