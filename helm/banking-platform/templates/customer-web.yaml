{{- if .Values.customerWeb.enabled }}
{{- if and .Values.customerWeb.proxyApiToBff .Values.ingress.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.customerWeb.name }}-nginx
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "banking-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.customerWeb.name }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /v1/ {
            proxy_pass http://bff-api-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://bff-api-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.customerWeb.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "banking-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.customerWeb.name }}
spec:
  replicas: {{ .Values.customerWeb.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.customerWeb.name }}
  template:
    metadata:
      labels:
        {{- include "banking-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.customerWeb.name }}
    spec:
      containers:
        - name: {{ .Values.customerWeb.name }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.customerWeb.name }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- if and .Values.customerWeb.proxyApiToBff .Values.ingress.enabled }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.customerWeb.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      {{- if and .Values.customerWeb.proxyApiToBff .Values.ingress.enabled }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Values.customerWeb.name }}-nginx
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.customerWeb.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "banking-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.customerWeb.name }}
  {{- if .Values.ingress.enabled }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ .Values.customerWeb.name }}"}'
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: {{ .Values.customerWeb.name }}
  ports:
    - name: http
      port: {{ .Values.customerWeb.port }}
      targetPort: http
{{- end }}
